server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: edgecloud-alert-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/alert_db}
    username: ${SPRING_DATASOURCE_USERNAME:alert_user}
    password: ${SPRING_DATASOURCE_PASSWORD:alert_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
edgecloud:
  security:
    jwt-secret: ${EDGECLOUD_JWT_SECRET:edgecloud-monitor-development-secret-key-for-jwt-token-generation}
  downstream:
    project-base-url: ${EDGE_CLOUD_PROJECT_URL:http://localhost:8086}
  alert:
    high-latency-threshold-ms: ${HIGH_LATENCY_MS:1000}
    evaluation:
      duplicate-maximum-size: ${ALERT_EVALUATION_DUPLICATE_MAXIMUM_SIZE:10000}
      duplicate-ttl-seconds: ${ALERT_EVALUATION_DUPLICATE_TTL_SECONDS:30}
  notification:
    base-url: ${EDGE_CLOUD_NOTIFICATION_URL:http://localhost:8085}
    internal-service-key: ${EDGECLOUD_INTERNAL_SERVICE_KEY:}
    publisher-enabled: ${ALERT_NOTIFICATION_PUBLISHER_ENABLED:true}
    poll-interval: ${ALERT_NOTIFICATION_POLL_INTERVAL:5s}
    batch-size: ${ALERT_NOTIFICATION_BATCH_SIZE:50}
    stale-timeout: ${ALERT_NOTIFICATION_STALE_TIMEOUT:5m}
    connect-timeout: ${ALERT_NOTIFICATION_CONNECT_TIMEOUT:2s}
    read-timeout: ${ALERT_NOTIFICATION_READ_TIMEOUT:5s}
